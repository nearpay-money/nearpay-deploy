name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shell scripts
        run: shellcheck scripts/*.sh compose/init/postgres/roles.sh
      - name: Live setup script (offline unit tests)
        run: |
          npm install -g pnpm@9.15.9
          pnpm -C scripts/live-setup install --frozen-lockfile
          pnpm -C scripts/live-setup test
      - name: Seed throwaway test keys
        run: scripts/seed.sh keys
      - name: Compose configuration (every profile)
        run: |
          cp compose/env/local.env.example compose/env/local.env
          docker compose --project-directory compose -f compose/compose.yaml -f compose/compose.local.yaml \
            --env-file compose/env/local.env --env-file .secrets/public/keys.env --profile '*' config --quiet
      - name: Compose configuration (beta overlay)
        run: |
          mkdir -p .secrets/beta
          for f in cloudflared_token resend_api_key turnstile_sitekey turnstile_secret telegram_bot_token \
            grafana_admin_password ops_attestation_roots.pem; do echo placeholder > ".secrets/beta/$f"; done
          : > .secrets/beta/google_client_secret # optional (ADR-0026): empty = Continue with Google off
          sed 's/__TELEGRAM_CHAT_ID__/1/' compose/monitoring/alertmanager/alertmanager.yml.tmpl > .secrets/beta/alertmanager.yml
          scripts/seed.sh live
          NP_CF_ACCESS_AUD=placeholder NP_CF_ACCESS_TEAM_DOMAIN=placeholder.cloudflareaccess.com \
          docker compose --project-name nearpay-beta --project-directory compose -f compose/compose.yaml \
            -f compose/compose.local.yaml -f .secrets/live/compose.live.yaml -f compose/compose.beta.yaml \
            --env-file compose/env/local.env --env-file compose/env/beta.env --env-file .secrets/public/keys.env \
            --profile '*' config --quiet
      # promtool of the beta's Prometheus image (compose.beta.yaml prom/prometheus:v3.5.3), checksum-pinned: the alert-rule
      # tests run `promtool check rules` and the rule unit tests (scripts/test/promtool/) with it
      - name: promtool
        run: |
          v=3.5.3
          curl -fsSL -o /tmp/prometheus.tgz "https://github.com/prometheus/prometheus/releases/download/v$v/prometheus-$v.linux-amd64.tar.gz"
          echo "8c30b9d99664e39b0363c0ba54fab30a7958e9d3de27246bf26ed85e6cfb8946  /tmp/prometheus.tgz" | sha256sum -c -
          tar -xzf /tmp/prometheus.tgz -C /tmp --strip-components=1 "prometheus-$v.linux-amd64/promtool"
          echo "PROMTOOL=/tmp/promtool" >> "$GITHUB_ENV"
      # after the Compose steps: the uptime tests also check the merged beta configuration (seeded keys, placeholders)
      - name: Deploy script tests (routing-health smoke, alert rules, uptime, runbook)
        run: node --test --test-reporter=spec scripts/test/*.test.mjs
      - name: Platform starts healthy
        run: |
          docker compose --project-name nearpay --project-directory compose -f compose/compose.yaml -f compose/compose.local.yaml \
            --env-file compose/env/local.env --env-file .secrets/public/keys.env up -d --wait --build
          curl -fsS --cacert .secrets/tls/ca.pem --resolve api.nearpay.localhost:443:127.0.0.1 https://api.nearpay.localhost/healthz
