# Beta alerts (→ Alertmanager → Telegram). A small, high-signal set: each one means "look now". Metric names are the
# ones the services export (kit: nearpay_<svc>_http_requests_total{route,code}, …_outbox_lag_seconds,
# …_dead_letters_open, …_jobs_due{kind}; service-specific: see the comment on each rule). Annotations feed the Telegram
# message: summary (what), description (detail), runbook (first thing to try; docs/beta-launch.md "When an alert fires").
groups:
  - name: nearpay-availability
    rules:
      - alert: ServiceDown
        expr: up{job="nearpay"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is down"
          description: "Prometheus cannot reach {{ $labels.instance }} (service {{ $labels.service }})."
          runbook: "scripts/beta.sh status; scripts/beta.sh logs {{ $labels.instance }}"

      - alert: PlatformComponentDown
        expr: up{job=~"traefik|node|alertmanager"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus cannot reach {{ $labels.instance }}."
          runbook: "scripts/beta.sh status; scripts/beta.sh logs {{ $labels.job }}"

      - alert: ErrorSpike
        expr: |
          (
            sum by (service) (rate({__name__=~"nearpay_.+_http_requests_total", code=~"5.."}[5m]))
            / sum by (service) (rate({__name__=~"nearpay_.+_http_requests_total"}[5m]))
          ) > 0.05
          and sum by (service) (rate({__name__=~"nearpay_.+_http_requests_total", code=~"5.."}[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }}: {{ $value | humanizePercentage }} of requests fail (5xx)"
          description: "More than 5% server errors for 5 minutes."
          runbook: "scripts/beta.sh logs {{ $labels.service }}-api; Grafana > NearPay beta > Errors"

      - alert: EdgeErrorSpike
        expr: |
          (
            sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
            / sum by (service) (rate(traefik_service_requests_total[5m]))
          ) > 0.10
          and sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Gateway route {{ $labels.service }}: {{ $value | humanizePercentage }} 5xx"
          description: "Traefik sees more than 10% server errors on this route (incl. static sites and console)."
          runbook: "scripts/beta.sh logs traefik"

  - name: nearpay-money-path
    rules:
      # sentinel: nearpay_sentinel_kill_switch_engaged (1 while live quoting is stopped). Since ADR-0028 sentinel engages it
      # by itself only on corroborated breaches across accounts (actor "sentinel", reason "systemic integrity breach…");
      # otherwise an operator engaged it. Either way it stays on until ops release it in the console.
      - alert: KillSwitchEngaged
        expr: max(nearpay_sentinel_kill_switch_engaged) == 1
        labels: { severity: critical }
        annotations:
          summary: "Kill switch engaged: live payments are stopped"
          description: "Sentinel reports the kill switch on; live quoting is refused until ops release it. Actor sentinel = corroborated integrity breaches across merchants (a security event: find the cause before releasing); otherwise an operator engaged it. See who and why with the first command."
          runbook: "scripts/beta.sh ops sentinel kill-switch; scripts/beta.sh ops sentinel integrity-breaches; release: Console (ops.nearpay.money) > Kill switch > Request release, wait 5 min, Approve release (new Access login, reason of 20+ characters); then scripts/beta.sh routing (docs/beta-launch.md 'Releasing the kill switch')"

      # sentinel: nearpay_sentinel_integrity_refusals_total{livemode,evidence,rule,address} — security refusals of deposit
      # instructions. address="genuine" + evidence="pipeline": a quote for a deposit address NearPay issued disagrees with
      # the provider's signature, NearPay's referral/treasury or identity's registry (ADR-0028). Sentinel refused that
      # payment and quarantined the merchant (AccountQuarantined); other merchants keep working.
      - alert: IntegrityBreachRefused
        expr: sum by (rule) (increase(nearpay_sentinel_integrity_refusals_total{address="genuine", evidence="pipeline"}[15m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "Sentinel refused a NearPay quote that failed its integrity check ({{ $labels.rule }})"
          description: "A deposit address NearPay issued came with a quote that failed {{ $labels.rule }} (R2 signature, R3 referral, R4 deposit address/lifetime, R5 recipient, R6 treasury fee). That payment was refused and its merchant quarantined; everyone else keeps working. Three such refusals across two merchants within 15 minutes stop live payments (KillSwitchEngaged)."
          runbook: "scripts/beta.sh ops sentinel integrity-breaches; scripts/beta.sh logs sentinel-api | grep 'ALERT quote integrity breach'"

      # sentinel: nearpay_sentinel_quarantines_active — merchants whose deposit instructions sentinel does not sign right now
      # (a breach on one of their payments; expires after NP_QUARANTINE_TTL_S, default 30 min, unless ops extend or clear it).
      - alert: AccountQuarantined
        expr: max(nearpay_sentinel_quarantines_active) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | humanize }} merchant(s) quarantined by sentinel"
          description: "Sentinel holds deposit instructions for these merchants after an integrity refusal (their payers see 'temporarily unavailable'). It clears by itself when the quarantine expires; clear it sooner once you know the refusal was not tampering."
          runbook: "scripts/beta.sh ops sentinel quarantines; scripts/beta.sh ops sentinel quarantine-clear <acct_…> '<why>'"

      # sentinel: the same integrity rule failing for several merchants at once is far more likely a provider format change
      # (1Click /v0/status echo, quote deadline, appFees shape) or rails/sentinel config skew than an attack on each of
      # them (audit 2026-11-12 SENTINEL-1). Two arms:
      #   - nearpay_sentinel_integrity_drift_total{source,rules} (sentinel with the SENTINEL-1 fix; series pre-created at
      #     0): source r2_only = a signature (R2) failure with every other rule passing, refused as unavailable;
      #     pattern = breaches classed as drift (same rules on >= 2 accounts); engaged = a uniform systemic engagement;
      #   - only when that metric is absent (older sentinel), from metrics exported since ADR-0028: exactly one rule (label
      #     of nearpay_sentinel_integrity_refusals_total) has live pipeline refusals on genuine addresses in 15 min, and
      #     the corroboration window holds >= 2 accounts.
      # It fires next to IntegrityBreachRefused / AccountQuarantined / KillSwitchEngaged, which still say what happened.
      - alert: IntegrityDriftSuspected
        expr: |
          sum by (source, rules) (increase(nearpay_sentinel_integrity_drift_total[15m])) > 0
          or on()
          (
            absent(nearpay_sentinel_integrity_drift_total)
            and on()
            count(sum by (rule) (increase(nearpay_sentinel_integrity_refusals_total{livemode="true", address="genuine", evidence="pipeline"}[15m])) > 0) == 1
            and on() max(nearpay_sentinel_integrity_systemic_window{measure="accounts"}) >= 2
          )
        labels: { severity: critical }
        annotations:
          summary: "Integrity drift suspected{{ if $labels.source }} ({{ $labels.source }}, {{ $labels.rules }}){{ end }}: likely a provider format change or config skew"
          description: |-
            Failing rule(s) on live NearPay deposit addresses in the last 15 minutes: {{ range $i, $s := query `sum by (rule) (increase(nearpay_sentinel_integrity_refusals_total{livemode="true", address="genuine", evidence="pipeline"}[15m])) > 0` }}{{ if $i }}, {{ end }}{{ $s.Labels.rule }}{{ else }}see integrity-breaches{{ end }}; merchants in the corroboration window: {{ with query `max(nearpay_sentinel_integrity_systemic_window{measure="accounts"})` }}{{ . | first | value | humanize }}{{ else }}unknown{{ end }}. {{ if eq $labels.source "r2_only" }}Sentinel could not verify 1Click's signature although every other check passed, and refused those payments as unavailable. {{ end }}One rule on every merchant usually means 1Click changed a format (status echo for R2, quote deadline for R4, appFees for R6) or rails and sentinel run with different treasury/referral/fee settings after a partial deploy, not tampering. Merchants stay quarantined and the kill switch may engage until the cause is fixed.
          runbook: "scripts/beta.sh ops sentinel integrity-breaches (compare the reasons with the 1Click changelog); compare NP_TREASURY_ACCOUNT / referral / fee settings of rails and sentinel (scripts/beta.sh up redeploys both); release the kill switch only after the fix (docs/beta-launch.md 'Releasing the kill switch')"

      # sentinel and rails: nearpay_<svc>_fee_config_info{hash} = 1 for the fingerprint of the treasury / referral /
      # provider-split configuration each runs with (SENTINEL-1 deploy-skew guard). Two fingerprints = a partial deploy:
      # every live quote then fails sentinel's R6/R3 checks, quarantining every merchant (IntegrityDriftSuspected next).
      # Sentinel exports it with the SENTINEL-1 fix; the rails name is ASSUMED NAME (same shape) until rails ships it.
      - alert: FeeConfigSkew
        expr: count(count by (hash) ({__name__=~"nearpay_(sentinel|rails)_fee_config_info"} == 1)) > 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Rails and sentinel run with different treasury/referral/fee settings"
          description: "Fingerprints: {{ range $i, $s := query `max by (service, hash) ({__name__=~\"nearpay_(sentinel|rails)_fee_config_info\"} == 1)` | sortByLabel \"service\" }}{{ if $i }}, {{ end }}{{ $s.Labels.service }} {{ $s.Labels.hash }}{{ end }}. Sentinel checks every live quote against its own settings, so quotes built with the other settings fail its integrity checks and merchants get quarantined."
          runbook: "compare NP_TREASURY_ACCOUNT and the fee/referral settings in compose/env/*.env for rails and sentinel; scripts/beta.sh up (recreates both with the same settings)"

      # sentinel: nearpay_sentinel_attestations_total{kind,result,reason} — co-signing of deposit instructions. result
      # "unavailable" = sentinel could not verify (reason R1: 1Click /v0/status or its API key; registry: identity's
      # destination registry; asset: 1Click /v0/tokens; quarantined: the merchant is held; provider: 1Click not
      # configured; checks: the quote could not be verified; integrity_drift: refused as provider drift, SENTINEL-1).
      # Routing stays green, so LivePaymentsNotRouting does not
      # fire, and beta traffic is far below ErrorSpike's threshold (audit SENTINEL-3). >= 3 in 10 min with no fresh
      # signature (a cached one does not count) = checkout is dead for payers.
      - alert: AttestationsFailing
        expr: |
          sum by (reason) (increase(nearpay_sentinel_attestations_total{result="unavailable"}[10m])) >= 3
          unless on() sum(increase(nearpay_sentinel_attestations_total{result="signed", reason="ok"}[10m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "Sentinel cannot verify deposit instructions ({{ $labels.reason }}): payers cannot pay"
          description: |-
            {{ $value | humanize }} co-signing request(s) answered "unavailable" ({{ $labels.reason }}) in 10 minutes and none was signed: payers see "Deposit instructions cannot be verified" although routing is fine. {{ if eq $labels.reason "R1" }}1Click /v0/status is unreachable or refuses sentinel's API key (expired or revoked key, egress).{{ else if eq $labels.reason "registry" }}Sentinel cannot read identity's destination registry in time (identity database, db_registry_url_sentinel).{{ else if eq $labels.reason "asset" }}The paid asset is missing from 1Click's /v0/tokens list (1Click tokens endpoint, egress).{{ else if eq $labels.reason "quarantined" }}The merchant is quarantined after an integrity refusal (AccountQuarantined).{{ else if eq $labels.reason "provider" }}Sentinel has no 1Click provider configured (NP_ONECLICK_BASE_URL, .secrets/live/oneclick_api_key).{{ else if eq $labels.reason "checks" }}The quote could not be verified (provider echo, unknown recipient): the attestation records say which check.{{ else if eq $labels.reason "integrity_drift" }}Sentinel classed the failures as provider-wide drift (IntegrityDriftSuspected).{{ end }} It recovers by itself once the dependency answers.
          runbook: |-
            {{ if eq $labels.reason "quarantined" }}scripts/beta.sh ops sentinel quarantines{{ else if eq $labels.reason "registry" }}scripts/beta.sh logs sentinel-api | grep registry; scripts/beta.sh status (identity, postgres){{ else if eq $labels.reason "checks" }}scripts/beta.sh ops sentinel attestations <pa_… | deposit address>{{ else }}scripts/beta.sh logs sentinel-api | grep -i unavailable; scripts/beta.sh logs egress-proxy; key: .secrets/live/oneclick_api_key{{ end }}

      # Rails' (and payments') local copy of sentinel's kill switch disagrees with sentinel (audit RAILS-1): a missed
      # evt.sentinel.kill_switch.* event (stopped consumer, dead letter, lost NATS state, stalled outbox). Arms:
      #   1. sentinel released, rails still blocks live routing on kill_switch_engaged (payments stay stopped after a release);
      #   2. sentinel engaged, rails routes live (not blocked on kill_switch_engaged nor kill_switch_unknown);
      #   3. nearpay_{rails,payments}_kill_switch_diverged (1 when the copy still differs from sentinel after the last
      #      periodic read was applied; rails/payments with the RAILS-1 / PAYMENTS-1 re-sync), e.g. a copy AHEAD of
      #      sentinel (sentinel's database recreated) that never accepts sentinel's lower versions again. Absent on
      #      older images: the arm never fires. Versions: …_kill_switch_version (the copy's; -1 unknown) and
      #      …_kill_switch_source_version (sentinel's at the last read).
      # Arms 1 and 2 use metrics exported today. Rails re-reads sentinel at most every 60 s once the RAILS-1 re-sync ships.
      - alert: KillSwitchCopyDiverged
        expr: |
          (
            max(nearpay_sentinel_kill_switch_engaged) == 0
            and on() max(nearpay_rails_routing_blocked{livemode="true", reason="kill_switch_engaged"}) == 1
          )
          or
          (
            max(nearpay_sentinel_kill_switch_engaged) == 1
            and on() max(nearpay_rails_routing_blocked{livemode="true", reason="kill_switch_engaged"}) == 0
            and on() max(nearpay_rails_routing_blocked{livemode="true", reason="kill_switch_unknown"}) == 0
          )
          or
          (
            max by (service) ({__name__=~"nearpay_(rails|payments)_kill_switch_diverged"}) == 1
          )
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "{{ if $labels.service }}{{ $labels.service }}'s{{ else }}Rails'{{ end }} copy of the kill switch disagrees with sentinel"
          description: |-
            Sentinel: {{ with query `max(nearpay_sentinel_kill_switch_engaged)` }}{{ if eq (. | first | value) 1.0 }}engaged{{ else }}released{{ end }}{{ else }}unknown{{ end }}{{ with query `max(nearpay_rails_kill_switch_source_version) >= 0` }} (version {{ . | first | value }} at rails' last read){{ end }}. Rails blocks live routing on the kill switch: {{ with query `max(nearpay_rails_routing_blocked{livemode="true", reason="kill_switch_engaged"})` }}{{ if eq (. | first | value) 1.0 }}yes{{ else }}no{{ end }}{{ else }}unknown{{ end }}{{ with query `max(nearpay_rails_kill_switch_version) >= 0` }} (rails copy version {{ . | first | value }}){{ end }}. The copy missed sentinel's last kill-switch event. If sentinel released and rails still blocks: payers stay stopped after the release. If sentinel engaged and rails routes: live payments go on although they were stopped — act now.
          runbook: "scripts/beta.sh ops rails flags (quoting_enabled, source_version) vs scripts/beta.sh ops sentinel kill-switch (engaged, version); scripts/beta.sh logs rails-feeds (consumer); DeadLetters; emergency, after checking sentinel's state: scripts/beta.sh ops rails flag-set quoting_enabled <true|false> '<reason>' (docs/beta-launch.md 'Releasing the kill switch')"

      # rails: nearpay_rails_routing_available{livemode} (0 = every payment option is unavailable: the payer sees
      # "Payments are temporarily unavailable") and nearpay_rails_routing_blocked{livemode,reason} (1 per blocking
      # reason: kill_switch_engaged, kill_switch_unknown, treasury_unset, cross_chain_paused, settlement_price_stale,
      # settlement_price_missing, settlement_price_depeg, settlement_price_disagree, fx_unavailable). The description
      # lists the current reasons with the fix for each (same hints as scripts/lib/routing-health.mjs).
      - alert: LivePaymentsNotRouting
        expr: max(nearpay_rails_routing_available{livemode="true"}) == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Live payments cannot route: every payment option is unavailable"
          description: |-
            Payers see "Payments are temporarily unavailable". Blocking:
            {{- range query `max by (reason) (nearpay_rails_routing_blocked{livemode="true"}) == 1` }}
            - {{ .Labels.reason }}: {{ if eq .Labels.reason "kill_switch_engaged" }}{{ if query `max(nearpay_sentinel_kill_switch_engaged) == 0` }}sentinel has already released the kill switch but rails' copy is still engaged: rails missed the release (KillSwitchCopyDiverged; scripts/beta.sh ops rails flags){{ else }}find out why the kill switch was engaged, then release it in the console: request, wait 5 min, approve with a new login (docs/beta-launch.md 'Releasing the kill switch'){{ end }}{{ else if eq .Labels.reason "kill_switch_unknown" }}rails cannot read sentinel's kill switch (logs rails-api: ALERT kill_switch_unknown){{ else if eq .Labels.reason "treasury_unset" }}set NP_TREASURY_ACCOUNT and run scripts/beta.sh up{{ else if eq .Labels.reason "cross_chain_paused" }}scripts/beta.sh ops rails flag-set cross_chain_enabled true 'resume'{{ else if eq .Labels.reason "settlement_price_stale" }}1Click prices are not reaching rails (logs rails-feeds: ALERT token_registry_refresh_failed; logs egress-proxy){{ else if eq .Labels.reason "settlement_price_missing" }}a price source lacks the settlement asset (logs rails-feeds){{ else if eq .Labels.reason "settlement_price_depeg" }}the settlement stablecoin is off its peg: wait{{ else if eq .Labels.reason "settlement_price_disagree" }}1Click and CoinGecko disagree: logs rails-feeds, usually clears{{ else if eq .Labels.reason "fx_unavailable" }}no current ECB rate (logs rails-feeds, egress proxy){{ else }}see scripts/beta.sh routing{{ end }}
            {{- end }}
          runbook: "scripts/beta.sh routing; docs/beta-launch.md 'Payments are temporarily unavailable'"

      # rails: nearpay_rails_token_registry_age_seconds{livemode} — seconds since the token registry last refreshed from
      # 1Click (live) / the sandbox (test); +Inf = never. Refreshes run every 30 s; prices go stale after 5 min.
      - alert: TokenRegistryStale
        expr: max by (livemode) (nearpay_rails_token_registry_age_seconds) > 300
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Token registry (livemode={{ $labels.livemode }}) not refreshed for {{ $value | humanizeDuration }}"
          description: "rails-feeds cannot load the token list (1Click unreachable through the egress proxy, auth, empty list); settlement prices go stale and payments stop routing."
          runbook: "scripts/beta.sh logs rails-feeds | grep 'ALERT token_registry_refresh_failed'; scripts/beta.sh logs egress-proxy"

      # rails: nearpay_rails_tracker_lag_blocks{tracker} — blocks between the chain's counted head and a tracker cursor
      # (near-indexer, evm:<chain>; 0 while idle). After the Mac sleeps the NEAR indexer catches up block by block (audit
      # RAILS-3): destination evidence on NEAR then comes only from the verifier backstop and vault events are late.
      - alert: TrackerLagging
        expr: max by (tracker) (nearpay_rails_tracker_lag_blocks) > 200
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Rails tracker {{ $labels.tracker }} is {{ $value | humanize }} blocks behind"
          description: "The tracker has been more than 200 blocks behind its chain's head for 10 minutes. Payments that settle on that chain confirm late (\"confirming\"), and vault events reach billing late. Normal for a while after the Mac slept; it should shrink."
          runbook: "scripts/beta.sh logs rails-tracker | grep -i -E 'behind|ALERT'; NEAR: scripts/beta.sh logs egress-proxy (mainnet.neardata.xyz); EVM: the chain's RPC (NP_EVM_RPC_URLS_*)"

      # sentinel (and rails, if it exports the same): nearpay_<svc>_oneclick_key_expiry_seconds{mode} — Unix time of the
      # `exp` of the 1Click API key when it is a JWT (.secrets/live/oneclick_api_key; no series for a non-JWT key or an
      # older image). The alert value is the seconds left. An expired key stops quoting (rails) and every attestation
      # (sentinel: AttestationsFailing R1).
      - alert: OneClickKeyExpiring
        expr: min by (service, mode) ({__name__=~"nearpay_.+_oneclick_key_expiry_seconds"}) - time() < 7 * 86400
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }}: the 1Click API key{{ if $labels.mode }} ({{ $labels.mode }}){{ end }} expires in {{ $value | humanizeDuration }}"
          description: "When the key expires (a negative time means it already has), 1Click refuses rails' quotes and sentinel's status checks: no live payment can be made."
          runbook: "get a new key from 1Click, write it to .secrets/live/oneclick_api_key, scripts/beta.sh up (rails and sentinel read the same file)"

      # payments: nearpay_payments_reconciliation_diffs_total (target: zero)
      - alert: ReconciliationDifference
        expr: increase(nearpay_payments_reconciliation_diffs_total[1h]) > 0
        labels: { severity: critical }
        annotations:
          summary: "Payments reconciliation found {{ $value | humanize }} difference(s)"
          description: "Ledger and chain disagree; do not ignore."
          runbook: "scripts/beta.sh logs payments-worker"

      # rails: nearpay_rails_quote_integrity_failures_total (service marks it "alert")
      - alert: QuoteIntegrityFailure
        expr: increase(nearpay_rails_quote_integrity_failures_total[15m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "Rails refused {{ $value | humanize }} quote(s) on integrity checks"
          description: "A provider quote failed NearPay's integrity checks."
          runbook: "scripts/beta.sh logs rails-api"

      - alert: OutboxBacklog
        expr: max by (service) ({__name__=~"nearpay_.+_outbox_lag_seconds"}) > 300
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }}: events not published for {{ $value | humanizeDuration }}"
          description: "The oldest unpublished outbox row is older than 5 minutes (NATS or the service's relay is stuck)."
          runbook: "scripts/beta.sh logs {{ $labels.service }}-api; scripts/beta.sh logs nats"

      - alert: DeadLetters
        expr: max by (service) ({__name__=~"nearpay_.+_dead_letters_open"}) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }}: {{ $value | humanize }} unresolved dead letter(s)"
          description: "Messages the service gave up on; they need a look."
          runbook: "scripts/beta.sh logs {{ $labels.service }}-worker"

      # kit: nearpay_<svc>_consumer_lag_messages{durable} (pending + unacknowledged messages of a NATS durable consumer)
      # and nearpay_<svc>_consumer_running{durable} (1 while the supervised consume loop runs; kit with the KIT-1 fix,
      # absent before: only the lag arm). A consume loop that ended leaves the process
      # healthy while its events pile up (rails: kill-switch events; webhooks: deliveries; compliance: cases).
      - alert: ConsumerLagHigh
        expr: |
          max by (service, durable) ({__name__=~"nearpay_.+_consumer_lag_messages"}) > 0
          or
          min by (service, durable) ({__name__=~"nearpay_.+_consumer_running"}) == 0
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }}: event consumer {{ $labels.durable }} is not processing"
          description: "For 10 minutes messages have waited for this durable consumer (or its consume loop has stopped). Events it handles are not applied; for rails that includes the kill switch (KillSwitchCopyDiverged)."
          runbook: "scripts/beta.sh logs {{ $labels.service }}-<process> | grep -i -E 'consumer|background error' (the process that consumes {{ $labels.durable }}); restart it: docker restart nearpay-beta-{{ $labels.service }}-<process>-1; scripts/beta.sh logs nats"

      # kit: nearpay_<svc>_http_breaker_open{target} (1 while the breaker is open or half-open; kit with the KIT-2 fix,
      # absent before). Second arm, from metrics every kit exports
      # (nearpay_<svc>_external_calls_total{target,outcome}): the breaker refused calls for 5 min and not one call
      # reached the target (no probe), which is the stuck half-open breaker that only a restart cures (payments → rails
      # stops every payment creation; rails → 1Click every quote).
      - alert: HttpBreakerOpen
        expr: |
          max by (service, target) ({__name__=~"nearpay_.+_http_breaker_open"}) == 1
          or
          (
            sum by (service, target) (increase({__name__=~"nearpay_.+_external_calls_total", outcome="breaker_open"}[5m])) > 0
            unless on (service, target)
            sum by (service, target) (increase({__name__=~"nearpay_.+_external_calls_total", outcome=~"ok|error|timeout"}[5m])) > 0
          )
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }}: calls to {{ $labels.target }} are refused by the circuit breaker"
          description: "The breaker towards {{ $labels.target }} has refused calls for more than 2 minutes. If {{ $labels.target }} itself is down, fix that first; if it is up, the breaker is stuck and only a restart of the calling process clears it (kit before the KIT-2 fix)."
          runbook: "scripts/beta.sh status; scripts/beta.sh logs {{ $labels.service }}-api | grep -i breaker; target up but still refused: docker restart the {{ $labels.service }} process"

      # webhooks: nearpay_webhooks_due_backlog (deliveries due and not yet sent)
      - alert: WebhookBacklog
        expr: max(nearpay_webhooks_due_backlog) > 100
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | humanize }} webhook deliveries waiting"
          description: "The dispatcher is not keeping up (or the egress proxy is failing)."
          runbook: "scripts/beta.sh logs webhooks-dispatcher; scripts/beta.sh logs egress-proxy"

      # billing (beta/public): nearpay_billing_keeper_collect_total{outcome,livemode} — failed live collections.
      - alert: KeeperCollectFailed
        expr: |
          sum by (outcome) (increase(nearpay_billing_keeper_collect_total{outcome=~"gas|other|insufficient|collect_failed", livemode="true"}[15m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "Keeper: {{ $value | humanize }} live collection(s) failed ({{ $labels.outcome }})"
          description: "billing-worker could not collect due mandates on mainnet in the last 15 minutes."
          runbook: "scripts/beta.sh logs billing-worker; gas: top up NP_KEEPER_ACCOUNT with NEAR"

      # The keeper not running at all: mandate.collect jobs that stay due.
      - alert: KeeperStuck
        expr: max(nearpay_billing_jobs_due{kind="mandate.collect"}) > 0
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "Keeper: {{ $value | humanize }} mandate collection(s) overdue for 30 min"
          description: "billing-worker is not collecting due mandates (keeper key, NEAR RPC or gas)."
          runbook: "scripts/beta.sh logs billing-worker; check NP_KEEPER_ACCOUNT balance"

      # rails: nearpay_rails_finality_recheck_total{chain,outcome} — post-success re-check of payments confirmed on ONE
      # block of their chain (ADR-0022 as amended 2026-11-10 17:10), every Tier-A family: EVM (any eip155 chain) at the
      # `finalized` tag (2 h window), Solana at `finalized` commitment (30 min), Bitcoin at 6 confirmations in the same
      # block (6 h). failed = at finality the transfer's block hash/slot changed, it vanished (orphaned / dropped fork)
      # or it failed; timeout = not final within the window. No chain filter: every chain and both outcomes alert. The
      # payment stays succeeded in rails: ops must review it (console evidence trail, finality_recheck_status).
      - alert: FinalityRecheckFailed
        expr: sum by (chain, outcome) (increase(nearpay_rails_finality_recheck_total{outcome=~"failed|timeout"}[30m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "Rails: {{ $value | humanize }} one-block payment(s) {{ $labels.outcome }} the finality re-check on {{ $labels.chain }}"
          description: "A payment confirmed on one block (EVM, Solana confirmed, Bitcoin 1 confirmation) was contradicted (or not final in time) at finality; it is still marked succeeded. Check the execution before delivering more."
          runbook: "scripts/beta.sh logs rails-tracker | grep 'ALERT finalized re-check'; console > Executions > evidence trail"

      # rails: nearpay_rails_vault_event_rejected_total (vault logs dropped instead of forwarded)
      - alert: VaultEventsRejected
        expr: increase(nearpay_rails_vault_event_rejected_total[30m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "Rails dropped {{ $value | humanize }} vault event(s)"
          description: "Vault logs that could not be forwarded to billing (keeper outcomes may be missing)."
          runbook: "scripts/beta.sh logs rails-tracker"

  - name: nearpay-ops
    rules:
      # Adaptive two-person rule (identity, sentinel, compliance): with one active operator, a two-person action is
      # completed by its requester after a delay; each one counts in nearpay_ops_single_operator_actions_total{action}.
      - alert: SingleOperatorAction
        expr: sum by (action) (increase(nearpay_ops_single_operator_actions_total[5m])) > 0
        labels: { severity: info }
        annotations:
          summary: "single-operator action: {{ $labels.action }}"
          description: "A two-person action ran with a single operator. If it was not you, act now."
          runbook: "Console > Audit log; if unexpected: Cloudflare Zero Trust > Access > revoke sessions, secure the Google account"

  - name: nearpay-email
    rules:
      # notify (beta/public): nearpay_notify_email_capped_total (mails refused by the daily cap) and
      # nearpay_notify_email_daily_cap_remaining (NP_EMAIL_DAILY_CAP=90, of which NP_EMAIL_DAILY_RESERVE=15 are kept for
      # security and approval mails). Resend's free plan stops at 100/day.
      - alert: EmailCapped
        expr: sum(increase(nearpay_notify_email_capped_total[15m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "Daily email cap reached: {{ $value | humanize }} mail(s) held back in 15 min"
          description: "notify refuses mail until the cap resets; sign-in, receipt and approval mails may not arrive."
          runbook: "Resend dashboard > Usage; Grafana > NearPay beta > Email"

      - alert: EmailCapLow
        expr: min(nearpay_notify_email_daily_cap_remaining) <= 15
        labels: { severity: warning }
        annotations:
          summary: "Only {{ $value | humanize }} emails left today"
          description: "notify is down to its reserve for security and approval mails."
          runbook: "Grafana > NearPay beta > Email (who is sending?)"

      - alert: EmailFailures
        expr: sum(increase(nearpay_notify_messages_total{status="failed"}[30m])) > 3
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | humanize }} emails failed in 30 min"
          description: "Resend SMTP refuses or fails sends (API key, domain verification or cap)."
          runbook: "scripts/beta.sh logs notify-worker"

  - name: nearpay-host
    rules:
      # node-exporter: Docker Desktop's data disk (a named volume mounted at /docker-disk)
      - alert: DiskLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/docker-disk"} / node_filesystem_size_bytes{mountpoint="/docker-disk"} < 0.15
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Docker disk {{ $value | humanizePercentage }} free"
          description: "Docker Desktop's disk is filling up; Postgres stops when it is full."
          runbook: "docker system df; docker image prune; raise Docker Desktop > Settings > Resources > Disk limit"

      - alert: DiskCritical
        expr: |
          node_filesystem_avail_bytes{mountpoint="/docker-disk"} / node_filesystem_size_bytes{mountpoint="/docker-disk"} < 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Docker disk almost full ({{ $value | humanizePercentage }} free)"
          description: "Postgres and NATS will stop writing very soon."
          runbook: "docker image prune -a; docker builder prune; raise the Docker Desktop disk limit"
