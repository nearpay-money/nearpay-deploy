# Response headers for every static site (included per location: nginx drops inherited add_header
# directives as soon as a location defines its own). The SPAs carry their full Content-Security-Policy
# in index.html; frame-ancestors only works as a header, so it is set here per route.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
