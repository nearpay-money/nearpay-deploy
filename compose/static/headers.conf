# Response headers for every static site (included per location: nginx drops inherited add_header
# directives as soon as a location defines its own). The SPAs carry their full Content-Security-Policy
# in index.html; frame-ancestors only works as a header, so it is set here per route.
add_header X-Content-Type-Options "nosniff" always;
# Hosted pages (/c/:id, /l/:id, /i/:id) send no referrer at all: their paths carry object ids (and an invoice page's
# URL fragment carries its secret), so neither may leak to wallets, explorers or other sites they link or load.
# $np_referrer_policy is mapped from the original request URI in nginx.conf.
add_header Referrer-Policy $np_referrer_policy always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
