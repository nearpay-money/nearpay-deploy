# Static sites behind Traefik (lld/platform.md §1): pay (checkout), js (loader), dashboard, docs and the apex (marketing).
# The console (ops.<domain>) runs its own nginx image (compose service `console`). Each site root is a build output mounted read-only; until a build exists
# scripts/up.sh mounts static/placeholder.
server_tokens off;
charset utf-8;
types { application/javascript mjs; }

# Referrer-Policy per request (headers.conf): no-referrer for the hosted pages; $request_uri is the original URI
# (try_files rewrites $uri to /index.html before the headers are added).
map $request_uri $np_referrer_policy {
  ~^/(c|l|i)/ no-referrer;
  default strict-origin-when-cross-origin;
}

# Unknown hosts and the container health check.
server {
  listen 8080 default_server;
  server_name _;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { return 404; }
}

# pay.<domain>: hosted checkout (/c/:id, /l/:id, /i/:id) may not be framed; /embed/:id is framed by
# merchant sites (https: anywhere, plus http://localhost:* for local development; checkout LLD §2).
server {
  listen 8080;
  server_name ~^pay\.;
  root /sites/pay;
  # /api/* belongs to the gateway (routed to services); anything that reaches nginx is unknown.
  location ^~ /api/ {
    include /etc/nginx/snippets/headers.conf;
    default_type text/plain;
    return 404 "not found\n";
  }
  location /assets/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location /embed/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Content-Security-Policy "frame-ancestors https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; object-src 'none'" always;
    add_header Cache-Control "no-cache" always;
    # per-response CSP nonce for wallet frames (NEAR Connect; checkout LLD §2): 128-bit $request_id
    sub_filter '{{NP_CSP_NONCE}}' $request_id;
    sub_filter_once off;
    try_files /index.html =404;
  }
  # hosted pages: checkout sessions /c/:id, payment links /l/:id (incl. /l/:id/complete) and invoices /i/:id. The
  # hosted CSP is the meta CSP of index.html (nonce substituted here); frame-ancestors only works as a header.
  location ~ ^/(c|l|i)/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;
    sub_filter '{{NP_CSP_NONCE}}' $request_id;
    sub_filter_once off;
    try_files /index.html =404;
  }
  location / {
    include /etc/nginx/snippets/headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header Cache-Control "no-cache" always;
    sub_filter '{{NP_CSP_NONCE}}' $request_id;
    sub_filter_once off;
    try_files $uri /index.html =404;
  }
}

# js.<domain>: the embed loader (/v1/nearpay.js) is loaded cross-origin by merchant pages, with
# Subresource Integrity, so it is served with CORS and cross-origin CORP. /v1/ is the protocol major,
# not a release: the file changes with releases, so it is cached briefly (5 min), never immutable.
server {
  listen 8080;
  server_name ~^js\.;
  root /sites/js;
  location / {
    include /etc/nginx/snippets/headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }
  location ~ ^/v[0-9]+/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }
}

# dashboard.<domain>: single-page app that is never framed.
server {
  listen 8080;
  server_name ~^dashboard\.;
  root /sites/dashboard;
  # /api/* belongs to the gateway (routed to services); anything that reaches nginx is unknown.
  location ^~ /api/ {
    include /etc/nginx/snippets/headers.conf;
    default_type text/plain;
    return 404 "not found\n";
  }
  location /assets/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / {
    include /etc/nginx/snippets/headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header Cache-Control "no-cache" always;
    # per-response CSP nonce for wallet frames (dashboard placeholder)
    sub_filter 'NPCSPNONCE' $request_id;
    sub_filter_once off;
    try_files $uri /index.html =404;
  }
}

# <domain> (apex): the marketing site (nearpay-site dist/web; its pages carry their own meta CSP and ship no
# JavaScript). Any two-label host is the apex: nearpay.money, nearpay.localhost.
server {
  listen 8080;
  server_name ~^[^.]+\.[^.]+$;
  root /sites/web;
  error_page 404 /404.html;
  location /_astro/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / {
    include /etc/nginx/snippets/headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ $uri.html =404;
  }
}

# www.<domain> → the apex (permanent; same path and query).
server {
  listen 8080;
  server_name ~^www\.(?<np_apex>.+)$;
  location / { return 301 https://$np_apex$request_uri; }
}

# docs.<domain>: static documentation site.
server {
  listen 8080;
  server_name ~^docs\.;
  root /sites/docs;
  error_page 404 /404.html;
  location / {
    include /etc/nginx/snippets/headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    try_files $uri $uri/ $uri.html =404;
  }
}
