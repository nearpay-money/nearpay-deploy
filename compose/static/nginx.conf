# Static sites behind Traefik (lld/platform.md §1): pay (checkout), js (loader), dashboard,
# ops (console) and docs. Each site root is a build output mounted read-only; until a build exists
# scripts/up.sh mounts static/placeholder.
server_tokens off;
charset utf-8;
types { application/javascript mjs; }

# Unknown hosts and the container health check.
server {
  listen 8080 default_server;
  server_name _;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { return 404; }
}

# pay.<domain>: hosted checkout (/c/:id, /l/:id, /i/:id) may not be framed; /embed/:id is framed by
# merchant sites (https: anywhere, plus http://localhost:* for local development; checkout LLD §2).
server {
  listen 8080;
  server_name ~^pay\.;
  root /sites/pay;
  # /api/* belongs to the gateway (routed to services); anything that reaches nginx is unknown.
  location ^~ /api/ {
    include /etc/nginx/snippets/headers.conf;
    default_type text/plain;
    return 404 "not found\n";
  }
  location /assets/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location /embed/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Content-Security-Policy "frame-ancestors https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; object-src 'none'" always;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }
  location / {
    include /etc/nginx/snippets/headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html =404;
  }
}

# js.<domain>: the embed loader (/v1/nearpay.js, versioned and immutable) is loaded cross-origin by
# merchant pages, with Subresource Integrity, so it is served with CORS and cross-origin CORP.
server {
  listen 8080;
  server_name ~^js\.;
  root /sites/js;
  location / {
    include /etc/nginx/snippets/headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }
  location ~ ^/v[0-9]+/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
}

# dashboard.<domain> and ops.<domain>: single-page apps that are never framed.
server {
  listen 8080;
  server_name ~^(?<site>dashboard|ops)\.;
  root /sites/$site;
  # /api/* belongs to the gateway (routed to services); anything that reaches nginx is unknown.
  location ^~ /api/ {
    include /etc/nginx/snippets/headers.conf;
    default_type text/plain;
    return 404 "not found\n";
  }
  location /assets/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / {
    include /etc/nginx/snippets/headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html =404;
  }
}

# docs.<domain>: static documentation site.
server {
  listen 8080;
  server_name ~^docs\.;
  root /sites/docs;
  error_page 404 /404.html;
  location / {
    include /etc/nginx/snippets/headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    try_files $uri $uri/ $uri.html =404;
  }
}
