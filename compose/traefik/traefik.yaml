# Traefik static configuration (lld/platform.md §1). Routers live in dynamic/ (file provider).
global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint: { to: websecure, scheme: https, permanent: true }
  websecure:
    address: ":443"
    http:
      tls: {}
    transport:
      respondingTimeouts:
        readTimeout: 60s
        idleTimeout: 180s
        writeTimeout: 0s # server-sent events stay open
  ping:
    address: "127.0.0.1:8082"

ping:
  entryPoint: ping
  manualRouting: true # also routed as api.<domain>/healthz (dynamic/routes.yaml)

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: false

log:
  level: WARN
  format: json

accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop # never log credentials, cookies or client secrets
