# Local npm registry (Verdaccio) for @nearpay-money/* and @nearpay-internal/* packages (system audit S-11).
# Sibling repos consume published artifacts from here (ADR-0001) until remote registries exist.
# No uplinks: only NearPay scopes are served; every other package comes from npmjs directly.
storage: /verdaccio/storage/data
plugins: /verdaccio/plugins
web:
  enable: true
  title: NearPay local registry
auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    max_users: 10
packages:
  "@nearpay-money/*":
    access: $all
    publish: $authenticated
    unpublish: $authenticated
  "@nearpay-money/*":
    access: $all
    publish: $authenticated
    unpublish: $authenticated
  "@nearpay-internal/*":
    access: $all
    publish: $authenticated
    unpublish: $authenticated
  "**":
    access: $all
    publish: $authenticated
server:
  keepAliveTimeout: 60
log:
  type: stdout
  format: json
  level: warn
