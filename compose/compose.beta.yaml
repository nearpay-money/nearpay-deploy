# Beta overlay: the v1 mainnet stack served at nearpay.money from the owner's Mac (docs/beta-launch.md). Applied by
# `scripts/up.sh beta` (scripts/beta.sh) on top of compose.yaml + compose.local.yaml + the live overlay
# (.secrets/live/compose.live.yaml), with compose/env/beta.env after local.env. Compose project `nearpay-beta`, so the
# beta has its own Postgres/NATS/Valkey volumes and never shares data with the local test stack.
#
# Edge: Cloudflare (TLS, WAF, Access, Turnstile) → Cloudflare Tunnel → cloudflared (this file) → Traefik's websecure
# entry point over plain HTTP on the private `tunnel` network. Traefik publishes no ports and trusts forwarded headers
# from cloudflared's fixed address only (traefik/traefik.beta.yaml); services read the client IP from CF-Connecting-IP
# (NP_ENV=server). No Mailpit, no merchant demo, no local CA; email goes out through Resend SMTP.
# Monitoring (local only): Prometheus, Alertmanager (→ Telegram), Grafana and node-exporter, UIs on 127.0.0.1.
#
# Uses Compose's !reset / !override merge tags (Compose 2.24+; up.sh requires 2.30+).

networks:
  # cloudflared ↔ Traefik only. Not internal: cloudflared dials Cloudflare's edge from here. cloudflared's address is
  # fixed (.2) and dynamic addresses come from the upper half, so nothing else can take it.
  tunnel:
    ipam:
      config: [{ subnet: "${NP_TUNNEL_SUBNET:-10.233.251.0/29}", ip_range: "${NP_TUNNEL_IP_RANGE:-10.233.251.4/30}" }]
  # Prometheus, Alertmanager, Grafana: host ports on 127.0.0.1 and Alertmanager's way out to api.telegram.org.
  monitoring: {}

volumes:
  prometheus-data: {}
  alertmanager-data: {}
  grafana-data: {}
  docker-disk-probe: {} # node-exporter's view of Docker's data disk (an empty named volume lives on it)

secrets:
  # real Turnstile secret (replaces the always-pass test secret for identity and payments)
  turnstile_secret: { file: ../.secrets/beta/turnstile_secret }
  # Resend API key = SMTP password (user `resend`) for notify
  smtp_password: { file: ../.secrets/beta/resend_api_key }
  cloudflared_token: { file: ../.secrets/beta/cloudflared_token }
  telegram_bot_token: { file: ../.secrets/beta/telegram_bot_token }
  grafana_admin_password: { file: ../.secrets/beta/grafana_admin_password } # generated by scripts/beta.sh
  # Continue with Google (ADR-0026), optional: the OAuth client secret (docs/beta-launch.md step 13a). scripts/beta.sh
  # creates an EMPTY file when absent, which leaves Google sign-in off (identity starts either way).
  google_client_secret: { file: ../.secrets/beta/google_client_secret }

configs:
  # Operator-key attestation roots (identity §11; Yubico's published roots unless the owner chooses otherwise)
  ops_attestation_roots: { file: ../.secrets/beta/ops_attestation_roots.pem }
  # rendered by scripts/beta.sh from monitoring/alertmanager/alertmanager.yml.tmpl (Telegram chat id)
  alertmanager_config: { file: ../.secrets/beta/alertmanager.yml }

services:
  # ------------------------------------------------------------------------------------------
  # Edge
  # ------------------------------------------------------------------------------------------
  traefik:
    ports: !reset []
    environment:
      NP_EDGE: cloudflare # routes.yaml: per-IP limits on CF-Connecting-IP, no local-only hosts, no local certificate
      NP_TUNNEL_IP: ${NP_TUNNEL_IP:-10.233.251.2} # routes.yaml: the console answers the tunnel only
    volumes: !override
      - ./traefik/traefik.beta.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      tunnel: {}
      internal:
        aliases: !reset [] # no container reaches the public hostnames through the gateway in beta (no TLS here)
      demo: !reset null

  # Remotely-managed tunnel: its public hostnames (nearpay.money, www, api, pay, js, dashboard, ops, docs →
  # http://traefik:8080) are set in the Cloudflare dashboard (docs/beta-launch.md step 4); only the token is local.
  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/cloudflared_token]
    secrets: [cloudflared_token]
    # Only Traefik is reachable from here: a hostname pointed anywhere else in the dashboard finds nothing.
    networks:
      tunnel: { ipv4_address: "${NP_TUNNEL_IP:-10.233.251.2}" }
    depends_on:
      traefik: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  # Local-only containers of compose.local.yaml stay off (profiles nobody enables in beta).
  mailpit:
    profiles: [local-only]
  merchant-demo:
    profiles: [local-only]

  # Webhook deliveries: no private address is allowed at all (no merchant demo network).
  egress-proxy:
    command: !override [--listen-ip=0.0.0.0, --listen-port=4750, --timeout=10s]
    networks: !override [internal, egress]

  # ------------------------------------------------------------------------------------------
  # Services: beta-only wiring (everything else comes from compose.yaml with beta.env values)
  # ------------------------------------------------------------------------------------------
  # Console sign-in (owner decision 2026-11-09): Google login through Cloudflare Access, the JWT verified by identity
  # (NP_OPS_AUTH_MODE=cloudflare_access; JWKS from https://$NP_CF_ACCESS_TEAM_DOMAIN/cdn-cgi/access/certs over the
  # egress network). The ops CLI (`scripts/beta.sh ops identity …`) runs inside identity-api with the same env. The
  # two-person rule is adaptive (no flag; identity/sentinel/compliance defaults). Payout wallets activate at once
  # (NP_COOLOFF_SECONDS=0 from beta.env; owner decision 2026-11-11). The hardware-key wiring (AAGUID list,
  # attestation roots) stays for passkey mode.
  identity-api: &identity-beta
    environment:
      NP_OPS_AUTH_MODE: ${NP_OPS_AUTH_MODE:-cloudflare_access}
      NP_CF_ACCESS_AUD: ${NP_CF_ACCESS_AUD:?set NP_CF_ACCESS_AUD (docs/beta-launch.md step 7; scripts/beta.sh asks for it)}
      NP_CF_ACCESS_TEAM_DOMAIN: ${NP_CF_ACCESS_TEAM_DOMAIN:?set NP_CF_ACCESS_TEAM_DOMAIN (docs/beta-launch.md step 7)}
      NP_OPS_BOOTSTRAP_EMAIL: ${NP_OPS_BOOTSTRAP_EMAIL:?set NP_OPS_BOOTSTRAP_EMAIL in compose/env/beta.env}
      NP_OPS_ATTESTATION_ROOTS_FILE: /etc/nearpay/ops-attestation-roots.pem
      # Continue with Google for the merchant dashboard (ADR-0026, identity LLD §22): on only when the client id
      # (beta.env / .secrets/beta/beta.env) AND a non-empty secret file are set; redirect URI
      # https://dashboard.nearpay.money/api/auth/google/callback (routes.yaml: identity-google-callback).
      NP_GOOGLE_CLIENT_ID: ${NP_GOOGLE_CLIENT_ID:-}
      NP_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
    configs:
      - { source: ops_attestation_roots, target: /etc/nearpay/ops-attestation-roots.pem }
    secrets: [google_client_secret]
  identity-worker: *identity-beta

  # Resend SMTP (implicit TLS on 465). NP_SMTP_USER / NP_SMTP_PASSWORD_FILE / NP_REPLY_TO / NP_EMAIL_DAILY_CAP /
  # NP_EMAIL_DAILY_RESERVE arrive with notify's beta/public branch (3b366f3); notify on main reads only NP_SMTP_URL and
  # would send unauthenticated (Resend refuses), so the beta needs that branch merged. Values: compose/env/beta.env.
  notify-api: &notify-beta
    environment:
      NP_EMAIL_PROVIDER: smtp
      NP_SMTP_URL: smtps://smtp.resend.com:465
      NP_SMTP_USER: resend
      NP_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      NP_REPLY_TO: ${NP_REPLY_TO:?set NP_REPLY_TO in compose/env/beta.env}
      NP_EMAIL_DAILY_CAP: ${NP_EMAIL_DAILY_CAP:-90}
      NP_EMAIL_DAILY_RESERVE: ${NP_EMAIL_DAILY_RESERVE:-15}
    secrets: [smtp_password]
  notify-worker: *notify-beta

  # ------------------------------------------------------------------------------------------
  # Monitoring (free, local): UIs on 127.0.0.1 only
  # ------------------------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.3
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${NP_PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=0.0.0.0:9090
      - --web.external-url=http://127.0.0.1:${NP_PROMETHEUS_PORT:-9090}
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${NP_PROMETHEUS_PORT:-9090}:9090"]
    networks: [internal, monitoring] # internal: every service's :9464 and Traefik's :8899
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  alertmanager:
    image: prom/alertmanager:v0.31.0
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
      - --web.external-url=http://127.0.0.1:${NP_ALERTMANAGER_PORT:-9093}
      - --cluster.listen-address= # single instance: no gossip port
    configs:
      - { source: alertmanager_config, target: /etc/alertmanager/alertmanager.yml }
    secrets: [telegram_bot_token]
    volumes: [alertmanager-data:/alertmanager]
    ports: ["127.0.0.1:${NP_ALERTMANAGER_PORT:-9093}:9093"]
    networks: [monitoring] # api.telegram.org
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9093/-/ready]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  grafana:
    image: grafana/grafana:12.4.0
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SERVER_ROOT_URL: http://127.0.0.1:${NP_GRAFANA_PORT:-3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/nearpay-beta.json
    secrets: [grafana_admin_password]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:${NP_GRAFANA_PORT:-3000}:3000"]
    networks: [monitoring]
    depends_on:
      prometheus: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  # Docker Desktop's Linux VM: CPU, memory and the free space of Docker's data disk (every named volume lives there;
  # an empty one is mounted at /docker-disk). No host mounts, so it works the same on Docker Desktop and Linux.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --web.listen-address=0.0.0.0:9100
      - '--collector.filesystem.fs-types-exclude=^(proc|sysfs|cgroup2?|tmpfs|devtmpfs|overlay|mqueue|nsfs|squashfs|shm)$$'
    volumes: [docker-disk-probe:/docker-disk:ro]
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
